# Replaces GitHub’s “Deploy static content” starter, which uploaded the
# source tree (no index.html) and 404’d https://girigurubilly.github.io/MoneyTracker/
name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:

runs-on: ubuntu-latest
steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_AUTH_ENABLED: "false"
          BASE_PATH: "/MoneyTracker/"
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
